services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: drew
      POSTGRES_PASSWORD: drew
      POSTGRES_DB: drew
    ports:
      - "5433:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "drew"]
      interval: 2s
      retries: 15

volumes:
  db:
